<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Car</title>
</head>
<body>
<h1>Create Car</h1>
<form th:action="@{/car/createCar}" th:object="${car}" method="post">
    <label for="carName">Car Name</label>
    <input id="carName" th:field="*{carName}" type="text" required>
    <br>
    <label for="carColor">Car Color</label>
    <input id="carColor" th:field="*{carColor}" type="text" required>
    <br>
    <label for="carQuantity">Car Quantity</label>
    <input id="carQuantity" th:field="*{carQuantity}" type="number" min="0" required>
    <br>
    <button type="submit">Create</button>
</form>
<p><a th:href="@{/car/listCar}">Back to Car List</a></p>
</body>
</html>
